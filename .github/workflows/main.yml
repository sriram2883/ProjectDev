name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Set up Node.js (18.x version)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18.x'

      # Install dependencies and build React app
      - name: Install dependencies and build React app
        run: |
          cd Client
          npm install
          npm run build
        env:
          CI: false

      # ✅ Deploy ONLY on ubuntu-latest
      - name: Deploy to Azure Static Web Apps
        if: matrix.os == 'ubuntu-latest'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: '74048477669b4b305607bef38b3c8dbdfce5f31b15822e5e9c8dff02747a754c06-6f755047-6e3c-4cdc-8da6-b7fc97c3bbac0002809010052d00'
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Client"
          output_location: "build"
          api_location: ""

      # Set up .NET SDK (for the Server project)
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.x'

      # Restore .NET dependencies
      - name: Restore .NET dependencies
        run: |
          cd Server
          dotnet restore

      # Build .NET project
      - name: Build .NET project
        run: |
          cd Server
          dotnet build --configuration Release
