name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18.x'

      - name: Install dependencies and build React app
        run: |
          cd Client
          npm install
          npm run build
        env:
          CI: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.x'

      - name: Restore .NET dependencies
        run: |
          cd Server
          dotnet restore

      - name: Build .NET project
        run: |
          cd Server
          dotnet build --configuration Release

      # ✅ Deploy ONLY the frontend to Azure Static Web Apps
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "74048477669b4b305607bef38b3c8dbdfce5f31b15822e5e9c8dff02747a754c06-6f755047-6e3c-4cdc-8da6-b7fc97c3bbac0002809010052d00"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Client"
          output_location: "build"
          api_location: ""
