name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18.x'

      - name: Install dependencies and build React app
        run: |
          cd Client
          npm install
          npm run build
        env:
          CI: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.x'

      - name: Restore .NET dependencies
        run: |
          cd Server
          dotnet restore
          
      - name: Build .NET project
        run: |
          cd Server
          dotnet build --configuration Release

      # ✅ Deploy ONLY the frontend to Azure Static Web Apps
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Client"
          output_location: "build"
          api_location: ""

      # ✅ Deploy the backend to Azure WebApp
      - name: Deploy .NET backend to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'your-app-name' # replace with your backend App Service name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './Server/bin/Release/net8.0/publish'
