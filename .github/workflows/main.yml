name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Setup Node.js for frontend
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18.x'

      # Install dependencies and build React app
      - name: Install dependencies and build React app
        run: |
          cd Client
          npm install
          npm run build
        env:
          CI: false

      # Setup .NET SDK for backend
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.x'

      # Restore .NET dependencies
      - name: Restore .NET dependencies
        run: |
          cd Server
          dotnet restore

      # Build .NET project
      - name: Build .NET project
        run: |
          cd Server
          dotnet build --configuration Release

      # Publish the .NET project to prepare for deployment
      - name: Publish .NET project
        run: |
          cd Server
          dotnet publish --configuration Release --output ./bin/Release/net8.0/publish

      # ✅ Deploy Frontend to Azure Static Web App
      - name: Deploy Frontend to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "Client"
          output_location: "build"
          api_location: ""  # If you have an API in the frontend, provide its location

      # ✅ Deploy Backend to Azure Web App (using the published .NET package)
      - name: Deploy Backend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: backendsriram
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./Server/bin/Release/net8.0/publish
          slot-name: production  # Optional, if you're deploying to a slot
        env:
          DOTNET_ROOT: /home/runner/.dotnet
