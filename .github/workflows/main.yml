name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      # Setup Node.js for React frontend
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18.x'

      - name: Install dependencies and build React app
        run: |
          cd Client
          npm install
          npm run build
        env:
          CI: false

      # Set up .NET SDK for backend
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v2
        with:
          dotnet-version: '8.x'

      - name: Restore .NET dependencies
        run: |
          cd Server
          dotnet restore

      - name: Build .NET project
        run: |
          cd Server
          dotnet build --configuration Release

      # ✅ Publish the .NET app to prepare for deployment
      - name: Publish .NET project
        run: |
          cd Server
          dotnet publish --configuration Release --output ./bin/Release/net8.0/publish

      # ✅ Deploy ONLY the backend to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: backendsriram
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./Server/bin/Release/net8.0/publish
          slot-name: production  # Optional, if you're deploying to a slot
        env:
          DOTNET_ROOT: /home/runner/.dotnet
